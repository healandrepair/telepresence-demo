apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
  namespace: telepresence-demo
  labels:
    app: hello-world
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      containers:
        - name: hello-world
          image: REGISTRY/hello-world:latest
          ports:
            - containerPort: 8080
          env:
            - name: TITLE
              value: "Hello World"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
